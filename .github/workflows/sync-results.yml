# Hourly results sync (JD, 2026-07-26: "can you just pull the results in
# every hour?").
#
# This lives in Actions rather than vercel.json for one reason: the
# project is on Vercel's Hobby plan, where a cron job fires ONCE A DAY no
# matter what schedule you write. "0 * * * *" there would quietly be a
# daily sync. Actions actually runs hourly and costs nothing.
#
# It calls the endpoint and nothing more — all the logic, and every
# safeguard, lives in app/api/sync/quickscores/route.js.
name: Sync results from QuickScores

# The hourly schedule is OFF (JD, 2026-07-26: "hae the cron stop checking
# for results, tournament is over"). Both halves are off: the primary
# schedule lived in Postgres and its pg_cron job is unscheduled, and the
# backup `schedule:` block that sat here is removed.
#
# Nothing else changed. The "Pull results from QuickScores" button on
# /scorekeeper still works, and so does Run workflow below. To put the
# hourly back for the next tournament that the league also runs on
# QuickScores:
#
#   1. Re-add:  schedule:\n    - cron: "47 * * * *"
#   2. Re-run supabase/migration-2026-07-26-sync-cron.sql with the real
#      CRON_SECRET substituted (it schedules the :23 database job).
#   3. Set divisions.source_url on that tournament's divisions.
on:
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Report what would change without writing"
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull results
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE: https://afa-southern-utah.vercel.app
        run: |
          DRY=""
          if [ "${{ inputs.dryRun }}" = "true" ]; then DRY="?dryRun=1"; fi
          # --fail-with-body so an auth failure or a 500 fails the run
          # loudly instead of looking like a quiet sync with nothing to do.
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE/api/sync/quickscores$DRY" | tee result.json
          python3 - <<'PY'
          import json
          r = json.load(open("result.json"))
          print(f"\nparsed {r['parsed']} · applied {r['applied']}")
          for c in r["changes"]:
              print(f"  {c['division']} {c['game']}: {c['was']} -> {c['now']}")
          for u in r["unmatched"]:
              print(f"  UNMATCHED {u}")
          for e in r["errors"]:
              print(f"  ERROR {e}")
          PY
